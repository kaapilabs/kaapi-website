<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaapi Labs — India's First Protein Filter Coffee</title>
    <meta name="description" content="What if your morning filter coffee had protein? Estate-origin coffee from the Western Ghats. 100% vegetarian. Join the waitlist.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #F5EBE0;
            --espresso: #2C1810;
            --brown: #5C3D2E;
            --gold: #C6993E;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== TOP BAR: Logo left + Headline right ===== */
        .top-bar {
            background: var(--cream);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 50px;
            gap: 30px;
        }
        .logo {
            width: 100px;
            height: auto;
            flex-shrink: 0;
        }
        .headline {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(1.1rem, 2.5vw, 1.6rem);
            font-weight: 500;
            color: var(--espresso);
            line-height: 1.35;
            text-align: right;
        }
        .headline em {
            color: var(--gold);
            font-style: italic;
        }

        /* ===== SMOOTH GRADIENT TRANSITION ===== */
        .gradient-transition {
            height: 180px;
            background: linear-gradient(
                to bottom,
                var(--cream) 0%,
                rgba(245, 235, 224, 0.95) 15%,
                rgba(245, 235, 224, 0.8) 30%,
                rgba(245, 235, 224, 0.6) 45%,
                rgba(245, 235, 224, 0.35) 60%,
                rgba(245, 235, 224, 0.15) 75%,
                rgba(245, 235, 224, 0.05) 88%,
                transparent 100%
            );
            position: relative;
            z-index: 2;
            margin-bottom: -180px;
        }

        /* ===== ESTATE PHOTO SECTION ===== */
        .estate-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 200px 50px 40px;
            position: relative;
            background: var(--espresso);
            background-image: url('estate.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .estate-section::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(
                to bottom,
                rgba(44, 24, 16, 0.35) 0%,
                rgba(44, 24, 16, 0.55) 50%,
                rgba(44, 24, 16, 0.8) 100%
            );
            z-index: 1;
        }

        /* ===== SPLIT CONTENT ===== */
        .split-content {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            width: 100%;
            max-width: 1100px;
            gap: 50px;
        }

        /* LEFT */
        .left-side {
            flex: 1;
        }
        .coming-soon {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(2.8rem, 7vw, 5rem);
            font-weight: 700;
            color: #FFFFFF;
            line-height: 1.05;
            letter-spacing: -1px;
        }
        .location-tag {
            margin-top: 14px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 300;
        }

        /* RIGHT */
        .right-side {
            flex: 1;
            max-width: 400px;
        }
        .estate-description {
            font-size: 0.95rem;
            font-weight: 300;
            color: rgba(245, 235, 224, 0.8);
            line-height: 1.75;
            margin-bottom: 28px;
        }
        .form-label {
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--gold);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: block;
        }
        .form-note {
            margin-top: 10px;
            font-size: 0.68rem;
            color: rgba(245, 235, 224, 0.25);
            font-weight: 300;
        }

        /* ===== FOOTER ===== */
        .footer {
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: var(--espresso);
            border-top: 1px solid rgba(245, 235, 224, 0.06);
        }
        .social-icons {
            display: flex;
            gap: 14px;
            align-items: center;
        }
        .social-icons a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid rgba(245, 235, 224, 0.12);
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .social-icons a:hover {
            border-color: var(--gold);
            background: rgba(198, 153, 62, 0.1);
        }
        .social-icons a svg {
            width: 14px;
            height: 14px;
            fill: rgba(245, 235, 224, 0.4);
            transition: fill 0.3s ease;
        }
        .social-icons a:hover svg { fill: var(--gold); }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeIn {
            from { opacity: 0; } to { opacity: 1; }
        }

        /* ===== MOBILE ===== */
        @media (max-width: 768px) {
            .top-bar {
                flex-direction: column;
                padding: 20px 24px;
                text-align: center;
                gap: 16px;
            }
            .logo { width: 90px; }
            .headline { text-align: center; font-size: 1.15rem; }

            .gradient-transition { height: 120px; margin-bottom: -120px; }

            .estate-section { padding: 140px 24px 35px; }
            .split-content {
                flex-direction: column;
                gap: 30px;
            }
            .coming-soon { font-size: 2.8rem; }
            .right-side { max-width: 100%; }
        }
    </style>
</head>
<body>

    <!-- TOP: Logo left + Headline right -->
    <div class="top-bar">
        <img src="logo.png" alt="Kaapi Labs" class="logo">
        <h1 class="headline">What if your morning filter coffee had <em>protein?</em></h1>
    </div>

    <!-- SMOOTH GRADIENT -->
    <div class="gradient-transition"></div>

    <!-- ESTATE PHOTO: Split layout -->
    <section class="estate-section">
        <div class="split-content">
            <div class="left-side">
                <h2 class="coming-soon">COMING<br>SOON</h2>
                <p class="location-tag">Sakleshpur · Chikmagalur</p>
            </div>
            <div class="right-side">
                <p class="estate-description">Estate-origin coffee from the Western Ghats of Karnataka. 100% vegetarian. Works hot and cold.</p>
                <label class="form-label">Join the waitlist</label>
                <script async src="https://eocampaign1.com/form/8258530a-939b-11f1-88f6-e9bf8e9e9083.js" data-form="8258530a-939b-11f1-88f6-e9bf8e9e9083"></script>
                <p class="form-note">No spam. Just one email when we launch.</p>
            </div>
        </div>
    </section>

</body>
</html>
