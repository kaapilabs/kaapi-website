<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaapi Labs — India's First Protein Filter Coffee</title>
    <meta name="description" content="What if your morning filter coffee had protein? Estate-origin coffee from the Western Ghats. 100% vegetarian. Join the waitlist.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #F5EBE0;
            --espresso: #2C1810;
            --brown: #5C3D2E;
            --gold: #C6993E;
            --muted: #8B7D75;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            overflow-x: hidden;
        }

        /* ===== TOP: LOGO SECTION (cream background) ===== */
        .logo-section {
            background: var(--cream);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 24px 40px;
            text-align: center;
        }
        .logo {
            width: 180px;
            height: auto;
            animation: fadeIn 1.2s ease-out;
        }

        /* ===== TRANSITION: cream fading into estate photo ===== */
        .transition-zone {
            height: 120px;
            background: linear-gradient(
                to bottom,
                var(--cream) 0%,
                rgba(245, 235, 224, 0.8) 30%,
                rgba(245, 235, 224, 0.3) 60%,
                transparent 100%
            );
            position: relative;
            z-index: 2;
            margin-bottom: -120px;
        }

        /* ===== BOTTOM: ESTATE PHOTO + CONTENT ===== */
        .hero {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 140px 24px 60px;
            position: relative;
            background: var(--espresso);
            background-image: url('estate.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Dark overlay for readability */
        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(
                to bottom,
                rgba(44, 24, 16, 0.5) 0%,
                rgba(44, 24, 16, 0.65) 40%,
                rgba(44, 24, 16, 0.8) 100%
            );
            z-index: 1;
        }
        .hero > * {
            position: relative;
            z-index: 2;
        }

        /* ===== HEADLINE ===== */
        .headline {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(2.2rem, 6vw, 3.8rem);
            font-weight: 600;
            color: var(--cream);
            line-height: 1.25;
            max-width: 750px;
            margin-bottom: 20px;
            animation: fadeInUp 1s ease-out 0.3s both;
        }
        .headline em {
            color: var(--gold);
            font-style: italic;
        }

        /* ===== SUBTITLE ===== */
        .subheadline {
            font-size: clamp(1rem, 2.5vw, 1.15rem);
            font-weight: 300;
            color: rgba(245, 235, 224, 0.7);
            max-width: 480px;
            line-height: 1.7;
            margin-bottom: 45px;
            animation: fadeInUp 1s ease-out 0.5s both;
        }

        /* ===== EMAIL FORM ===== */
        .form-wrapper {
            width: 100%;
            max-width: 440px;
            animation: fadeInUp 1s ease-out 0.7s both;
        }
        .form-label {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--gold);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 14px;
            display: block;
        }
        .form-note {
            margin-top: 14px;
            font-size: 0.73rem;
            color: rgba(245, 235, 224, 0.35);
            font-weight: 300;
        }

        /* ===== ESTATE TAG ===== */
        .estate-tag {
            margin-top: 50px;
            font-size: 0.78rem;
            color: rgba(245, 235, 224, 0.3);
            font-weight: 300;
            letter-spacing: 2px;
            animation: fadeInUp 1s ease-out 1s both;
        }

        /* ===== FOOTER ===== */
        .footer {
            padding: 20px 24px;
            text-align: center;
            background: var(--espresso);
        }
        .footer-links {
            display: flex;
            gap: 24px;
            justify-content: center;
        }
        .footer-links a {
            font-size: 0.73rem;
            color: rgba(245, 235, 224, 0.35);
            text-decoration: none;
            font-weight: 300;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }
        .footer-links a:hover { color: var(--gold); }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeIn {
            from { opacity: 0; } to { opacity: 1; }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .logo { width: 140px; }
            .logo-section { padding: 40px 24px 30px; }
            .transition-zone { height: 80px; margin-bottom: -80px; }
            .hero { padding: 100px 24px 50px; }
            .estate-tag { margin-top: 35px; }
        }
    </style>
</head>
<body>

    <!-- TOP: Logo on cream (matches logo background perfectly) -->
    <section class="logo-section">
        <img src="logo.png" alt="Kaapi Labs" class="logo">
    </section>

    <!-- TRANSITION: cream melts into the estate photo -->
    <div class="transition-zone"></div>

    <!-- BOTTOM: Estate photo with headline + form -->
    <section class="hero">
        <h1 class="headline">What if your morning filter coffee had <em>protein?</em></h1>
        <p class="subheadline">Estate-origin coffee from the Western Ghats of Karnataka. 100% vegetarian. Works hot and cold. Coming soon.</p>
        <div class="form-wrapper">
            <label class="form-label">Join the waitlist</label>
            <script async src="https://eocampaign1.com/form/8258530a-939b-11f1-88f6-e9bf8e9e9083.js" data-form="8258530a-939b-11f1-88f6-e9bf8e9e9083"></script>
            <p class="form-note">No spam. Just one email when we launch.</p>
        </div>
        <p class="estate-tag">Sakleshpur · Chikmagalur · Karnataka</p>
    </section>

    <footer class="footer">
        <div class="footer-links">
            <a href="https://instagram.com/kaapilabs" target="_blank">Instagram</a>
            <a href="mailto:hello@kaapilabs.com">Contact</a>
        </div>
    </footer>

</body>
</html>
