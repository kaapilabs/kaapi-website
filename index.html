<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaapi Labs — India's First Protein Filter Coffee</title>
    <meta name="description" content="What if your morning filter coffee had protein? Estate-origin coffee from the Western Ghats. 100% vegetarian. Join the waitlist.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #F5EBE0;
            --espresso: #2C1810;
            --brown: #5C3D2E;
            --gold: #C6993E;
            --muted: #8B7D75;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            overflow-x: hidden;
        }

        /* ===== TOP: CREAM SECTION ===== */
        .cream-section {
            background: var(--cream);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 24px 60px;
            text-align: center;
        }
        .logo {
            width: 170px;
            height: auto;
            margin-bottom: 40px;
            animation: fadeIn 1.2s ease-out;
        }
        .headline {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(2rem, 5.5vw, 3.5rem);
            font-weight: 600;
            color: var(--espresso);
            line-height: 1.25;
            max-width: 700px;
            animation: fadeInUp 1s ease-out 0.2s both;
        }
        .headline em {
            color: var(--gold);
            font-style: italic;
        }

        /* ===== TRANSITION ===== */
        .transition-zone {
            height: 100px;
            background: linear-gradient(
                to bottom,
                var(--cream) 0%,
                rgba(245, 235, 224, 0.6) 40%,
                rgba(245, 235, 224, 0.15) 70%,
                transparent 100%
            );
            position: relative;
            z-index: 2;
            margin-bottom: -100px;
        }

        /* ===== ESTATE PHOTO SECTION ===== */
        .estate-section {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 60px 60px;
            position: relative;
            background: var(--espresso);
            background-image: url('estate.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .estate-section::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(
                to bottom,
                rgba(44, 24, 16, 0.4) 0%,
                rgba(44, 24, 16, 0.55) 40%,
                rgba(44, 24, 16, 0.75) 100%
            );
            z-index: 1;
        }

        /* ===== SPLIT LAYOUT ===== */
        .estate-content {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            width: 100%;
            max-width: 1100px;
            gap: 60px;
        }

        /* LEFT: COMING SOON */
        .left-side {
            flex: 1;
            animation: fadeInUp 1s ease-out 0.4s both;
        }
        .coming-soon {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(3rem, 8vw, 5.5rem);
            font-weight: 700;
            color: #FFFFFF;
            line-height: 1.1;
            letter-spacing: -1px;
        }
        .coming-soon-sub {
            margin-top: 16px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 300;
        }

        /* RIGHT: INFO + FORM */
        .right-side {
            flex: 1;
            max-width: 420px;
            animation: fadeInUp 1s ease-out 0.6s both;
        }
        .estate-description {
            font-size: 1.05rem;
            font-weight: 300;
            color: rgba(245, 235, 224, 0.85);
            line-height: 1.8;
            margin-bottom: 35px;
        }
        .form-label {
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--gold);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: block;
        }
        .form-wrapper {
            width: 100%;
        }
        .form-note {
            margin-top: 12px;
            font-size: 0.7rem;
            color: rgba(245, 235, 224, 0.3);
            font-weight: 300;
        }

        /* ===== FOOTER ===== */
        .footer {
            padding: 28px 24px;
            text-align: center;
            background: var(--espresso);
            border-top: 1px solid rgba(245, 235, 224, 0.06);
        }
        .footer-location {
            font-size: 0.75rem;
            color: rgba(245, 235, 224, 0.3);
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 16px;
        }
        .social-icons {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }
        .social-icons a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid rgba(245, 235, 224, 0.15);
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .social-icons a:hover {
            border-color: var(--gold);
            background: rgba(198, 153, 62, 0.1);
        }
        .social-icons a svg {
            width: 16px;
            height: 16px;
            fill: rgba(245, 235, 224, 0.5);
            transition: fill 0.3s ease;
        }
        .social-icons a:hover svg {
            fill: var(--gold);
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeIn {
            from { opacity: 0; } to { opacity: 1; }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== MOBILE ===== */
        @media (max-width: 768px) {
            .cream-section { padding: 40px 24px 45px; }
            .logo { width: 140px; margin-bottom: 30px; }
            .transition-zone { height: 70px; margin-bottom: -70px; }
            .estate-section { padding: 90px 24px 50px; }
            .estate-content {
                flex-direction: column;
                gap: 35px;
                align-items: flex-start;
            }
            .coming-soon { font-size: 3rem; }
            .right-side { max-width: 100%; }
        }
    </style>
</head>
<body>

    <!-- TOP: Logo + Headline on cream -->
    <section class="cream-section">
        <img src="logo.png" alt="Kaapi Labs" class="logo">
        <h1 class="headline">What if your morning filter coffee had <em>protein?</em></h1>
    </section>

    <!-- TRANSITION: cream melts into estate -->
    <div class="transition-zone"></div>

    <!-- ESTATE PHOTO: split layout -->
    <section class="estate-section">
        <div class="estate-content">

            <!-- LEFT: Coming Soon -->
            <div class="left-side">
                <h2 class="coming-soon">Coming<br>Soon</h2>
                <p class="coming-soon-sub">Sakleshpur · Chikmagalur</p>
            </div>

            <!-- RIGHT: Description + Form -->
            <div class="right-side">
                <p class="estate-description">
                    Estate-origin coffee from the Western Ghats of Karnataka.
                    100% vegetarian. Works hot and cold.
                </p>
                <div class="form-wrapper">
                    <label class="form-label">Join the waitlist</label>
                    <script async src="https://eocampaign1.com/form/8258530a-939b-11f1-88f6-e9bf8e9e9083.js" data-form="8258530a-939b-11f1-88f6-e9bf8e9e9083"></script>
                    <p class="form-note">No spam. Just one email when we launch.</p>
                </div>
            </div>

        </div>
    </section>

    <!-- FOOTER: Social icons -->
    <footer class="footer">
        <p class="footer-location">Kaapi Labs · Karnataka, India</p>
        <div class="social-icons">

            <!-- Instagram -->
            <a href="https://instagram.com/kaapilabs" target="_blank" aria-label="Instagram">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

                </svg>
            </a>

            <!-- YouTube -->
            <a href="https://youtube.com/@kaapilabs" target="_blank" aria-label="YouTube">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M23.498 6.186a3.016 3.016 0 00-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 00.502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 002.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 002.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                </svg>
            </a>

            <!-- Facebook -->
            <a href="https://facebook.com/kaapilabs" target="_blank" aria-label="Facebook">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>

            <!-- Email -->
            <a href="mailto:hello@kaapilabs.com" aria-label="Email">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

            </a>

        </div>
    </footer>

</body>
</html>
