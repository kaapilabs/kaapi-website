<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaapi Labs — Something is Brewing</title>
    <meta name="description" content="India's first protein filter coffee. From our estate to your family's filter. Coming soon.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2C1810;
            font-family: 'Playfair Display', Georgia, serif;
            color: #F7F3EF;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
            position: relative;
        }

        /* ===== COFFEE CUP SVG ===== */
        .coffee-wrapper {
            margin-bottom: 30px;
            position: relative;
            display: inline-block;
        }

        .coffee-cup {
            width: 180px;
            height: auto;
            filter: drop-shadow(0 5px 25px rgba(198, 124, 78, 0.15));
        }

        /* ===== STEAM ANIMATION ===== */
        .steam-container {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 80px;
            z-index: 1;
        }

        .steam {
            position: absolute;
            bottom: 0;
            width: 6px;
            border-radius: 50%;
            background: rgba(198, 124, 78, 0.25);
            filter: blur(4px);
            animation: steamRise 3s ease-out infinite;
            opacity: 0;
        }

        .steam:nth-child(1) {
            left: 20px;
            animation-delay: 0s;
            height: 30px;
        }
        .steam:nth-child(2) {
            left: 35px;
            animation-delay: 0.4s;
            height: 40px;
            width: 7px;
        }
        .steam:nth-child(3) {
            left: 50px;
            animation-delay: 0.8s;
            height: 35px;
        }
        .steam:nth-child(4) {
            left: 65px;
            animation-delay: 1.2s;
            height: 45px;
            width: 8px;
        }
        .steam:nth-child(5) {
            left: 45px;
            animation-delay: 1.6s;
            height: 32px;
            width: 5px;
        }
        .steam:nth-child(6) {
            left: 30px;
            animation-delay: 2.0s;
            height: 38px;
        }
        .steam:nth-child(7) {
            left: 55px;
            animation-delay: 0.6s;
            height: 28px;
            width: 5px;
        }
        .steam:nth-child(8) {
            left: 40px;
            animation-delay: 1.8s;
            height: 42px;
            width: 7px;
        }

        @keyframes steamRise {
            0% {
                transform: translateY(0) scaleX(1);
                opacity: 0;
            }
            15% {
                opacity: 0.4;
            }
            50% {
                transform: translateY(-40px) scaleX(1.5) translateX(5px);
                opacity: 0.25;
            }
            80% {
                transform: translateY(-70px) scaleX(2) translateX(-3px);
                opacity: 0.1;
            }
            100% {
                transform: translateY(-100px) scaleX(2.5) translateX(8px);
                opacity: 0;
            }
        }

        /* ===== GLOW BEHIND CUP ===== */
        .glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(198, 124, 78, 0.08) 0%, transparent 70%);
            pointer-events: none;
            animation: glowPulse 4s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }

        /* ===== TEXT ===== */
        h1 {
            color: #C67C4E;
            font-size: 2.8em;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 12px;
            animation: fadeInUp 1.5s ease-out 0.3s both;
        }

        .tagline {
            color: #8B7D75;
            font-size: 1.2em;
            font-weight: 400;
            margin-bottom: 8px;
            animation: fadeInUp 1.5s ease-out 0.6s both;
        }

        .sub {
            color: #5C3D2E;
            font-size: 0.85em;
            font-weight: 400;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-family: Arial, sans-serif;
            margin-top: 25px;
            animation: fadeInUp 1.5s ease-out 0.9s both;
        }

        /* ===== FLOATING COFFEE BEANS ===== */
        .bean {
            position: fixed;
            opacity: 0.06;
            animation: floatBean 15s ease-in-out infinite;
        }
        .bean:nth-child(1) { top: 10%; left: 8%; animation-delay: 0s; }
        .bean:nth-child(2) { top: 20%; right: 12%; animation-delay: 3s; }
        .bean:nth-child(3) { bottom: 15%; left: 15%; animation-delay: 6s; }
        .bean:nth-child(4) { bottom: 25%; right: 8%; animation-delay: 9s; }
        .bean:nth-child(5) { top: 50%; left: 5%; animation-delay: 2s; }
        .bean:nth-child(6) { top: 40%; right: 6%; animation-delay: 7s; }

        @keyframes floatBean {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(15deg); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            h1 { font-size: 2em; }
            .tagline { font-size: 1em; }
            .coffee-cup { width: 140px; }
            .steam-container { top: -45px; width: 80px; }
        }
    </style>
</head>
<body>

    <!-- Floating coffee beans background -->
    <svg class="bean" width="40" height="55" viewBox="0 0 40 55"><ellipse cx="20" cy="28" rx="18" ry="25" fill="#5C3D2E"/><ellipse cx="22" cy="27" rx="2.5" ry="16" fill="#2C1810"/></svg>
    <svg class="bean" width="35" height="48" viewBox="0 0 35 48"><ellipse cx="17" cy="24" rx="15" ry="22" fill="#C67C4E"/><ellipse cx="19" cy="23" rx="2" ry="14" fill="#8B5E3C"/></svg>
    <svg class="bean" width="30" height="42" viewBox="0 0 30 42"><ellipse cx="15" cy="21" rx="13" ry="19" fill="#5C3D2E"/><ellipse cx="17" cy="20" rx="2" ry="12" fill="#2C1810"/></svg>
    <svg class="bean" width="38" height="52" viewBox="0 0 38 52"><ellipse cx="19" cy="26" rx="17" ry="24" fill="#C67C4E"/><ellipse cx="21" cy="25" rx="2.5" ry="15" fill="#8B5E3C"/></svg>
    <svg class="bean" width="25" height="35" viewBox="0 0 25 35"><ellipse cx="12" cy="18" rx="11" ry="16" fill="#5C3D2E"/><ellipse cx="14" cy="17" rx="1.5" ry="10" fill="#2C1810"/></svg>
    <svg class="bean" width="32" height="44" viewBox="0 0 32 44"><ellipse cx="16" cy="22" rx="14" ry="20" fill="#C67C4E"/><ellipse cx="18" cy="21" rx="2" ry="13" fill="#8B5E3C"/></svg>

    <div class="container">
        <!-- Coffee cup with steam -->
        <div class="coffee-wrapper">
            <div class="glow"></div>
            <div class="steam-container">
                <div class="steam"></div>
                <div class="steam"></div>
                <div class="steam"></div>
                <div class="steam"></div>
                <div class="steam"></div>
                <div class="steam"></div>
                <div class="steam"></div>
                <div class="steam"></div>
            </div>
            <svg class="coffee-cup" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
                <!-- Saucer -->
                <ellipse cx="100" cy="200" rx="85" ry="14" fill="#5C3D2E"/>
                <ellipse cx="100" cy="197" rx="80" ry="12" fill="#6B4A38"/>
                <ellipse cx="100" cy="195" rx="75" ry="10" fill="#7A5A45"/>

                <!-- Cup body -->
                <path d="M45 85 L50 180 Q50 195 100 195 Q150 195 150 180 L155 85" fill="#8B6F5E"/>
                <path d="M48 85 L52 178 Q52 192 100 192 Q148 192 148 178 L152 85" fill="#A08070"/>

                <!-- Coffee liquid inside -->
                <ellipse cx="100" cy="95" rx="50" ry="12" fill="#1A0E08"/>

                <!-- Cup rim -->
                <ellipse cx="100" cy="85" rx="55" ry="13" fill="#A08070"/>
                <ellipse cx="100" cy="85" rx="55" ry="13" fill="none" stroke="#8B6F5E" stroke-width="1.5"/>
                <ellipse cx="100" cy="83" rx="52" ry="11" fill="#B89880"/>

                <!-- Coffee surface shimmer -->
                <ellipse cx="90" cy="93" rx="20" ry="5" fill="#2C1810" opacity="0.4"/>
                <ellipse cx="110" cy="95" rx="12" ry="3" fill="#3D2A1E" opacity="0.3"/>

                <!-- Cup handle -->
                <path d="M155 100 Q182 100 182 130 Q182 160 155 160" fill="none" stroke="#A08070" stroke-width="8" stroke-linecap="round"/>
                <path d="M155 105 Q177 105 177 130 Q177 155 155 155" fill="none" stroke="#B89880" stroke-width="4" stroke-linecap="round"/>

                <!-- Subtle cup highlight -->
                <path d="M60 95 L63 170" stroke="#B89880" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
            </svg>
        </div>

        <!-- Text -->
        <h1>Something is brewing...</h1>
        <p class="tagline">India's first protein filter coffee. Coming soon.</p>
        <p class="sub">Kaapi Labs</p>
    </div>

</body>
</html>
